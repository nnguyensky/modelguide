name: Weekly price check

# Compares data.js with the LiteLLM and models.dev price databases.
# When prices differ, opens (or comments on) an issue labelled "price-check".
on:
  schedule:
    - cron: '23 7 * * 1'   # Mondays 07:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare prices
        id: cmp
        run: node tools/check-prices.mjs --out report.md
      - name: Open or update the price-check issue
        if: steps.cmp.outputs.diffs != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create price-check --color FBCA04 --description "Weekly price check found differences" --force
          num=$(gh issue list --label price-check --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file report.md
          else
            gh issue create --title "Price check: prices differ from data.js" --label price-check --body-file report.md
          fi
