name: Check page

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JS syntax
        run: |
          node --check data.js
          node --check app.js
          node --check sw.js
          node --check tools/check-prices.mjs
          node --check tools/build-feed.mjs
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
      - name: RSS feed is up to date with data.js
        run: node tools/build-feed.mjs --check
      - name: Install Playwright and axe-core
        run: |
          npm install --no-save playwright@1.63.0 axe-core@4.14.0
          npx playwright install --with-deps chromium
      - name: Smoke + accessibility test (all pages, controls, data, future dates, axe)
        run: node tests/smoke.mjs
