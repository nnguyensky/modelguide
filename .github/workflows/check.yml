name: Check page

on:
  push:
  pull_request:
  workflow_dispatch:   # lets the weekly bot start CI on the PRs it opens

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: JS syntax
        run: |
          node --check data.js
          node --check app.js
          node --check sw.js
          node --check checks.js
          node --check tools/weekly-check.mjs
          node --check tools/build.mjs
          node --check tests/weekly-check.test.mjs
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
      - name: Weekly-check logic (offline test)
        run: node tests/weekly-check.test.mjs
      - name: Generated files (feed.xml, sw.js) — the Build workflow commits them; this only warns
        continue-on-error: true
        run: node tools/build.mjs --check
      - name: Install Playwright and axe-core
        run: |
          npm install --no-save playwright@1.63.0 axe-core@4.14.0
          npx playwright install --with-deps chromium
      - name: Smoke + accessibility test (all pages, controls, data, future dates, axe)
        run: node tests/smoke.mjs
